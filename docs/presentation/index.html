<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DataCodex Notify</title>
<link rel="icon" type="image/png" href="../assets/icons/icon-green-32.png">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#14171c;--muted:#5b6472;--accent:#2f6bff;--accent-2:#1f9d55;--warn:#c98a00;--danger:#d93838;--border:#e3e6eb;--hero:linear-gradient(135deg,#eaf0ff 0%,#f6f7f9 55%,#e6f6ec 100%);--shadow:0 8px 30px rgba(20,23,28,.12);--nav-h:56px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--surface:#171b21;--text:#e8ebf0;--muted:#9aa3b2;--accent:#5a8bff;--accent-2:#34c26f;--warn:#e3a82b;--danger:#f06262;--border:#262c35;--hero:linear-gradient(135deg,#16213f 0%,#0f1216 55%,#12261b 100%);--shadow:0 8px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 clamp(16px,.55vw + 14px,20px)/1.6 "IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
img{max-width:100%}
h1{font-size:clamp(34px,6vw,68px);line-height:1.1;margin:0;letter-spacing:-.025em}
h2{font-size:clamp(26px,4vw,46px);line-height:1.2;margin:0}
p{margin:0;max-width:44em}
.kicker{color:var(--accent);font-weight:600;font-size:.8em;letter-spacing:.06em;text-transform:uppercase}
[dir=rtl] .kicker{letter-spacing:0}
.lead{color:var(--muted);font-size:1.12em}
.btn{display:inline-flex;align-items:center;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:.6em 1.25em;color:var(--text);text-decoration:none;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- top navigation */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:var(--nav-h);padding:0 clamp(12px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap}
.brand img{width:24px;height:24px}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{color:var(--muted);text-decoration:none;padding:.35em .6em;border-radius:8px;white-space:nowrap;font-size:.9em}
.links a:hover,.links a.on{color:var(--text);background:var(--surface)}
.tools{display:flex;gap:8px;align-items:center}
.tools .btn{padding:.3em .8em;font-size:.85em}

/* ---- sections */
.sec{padding:clamp(56px,11vh,120px) clamp(18px,6vw,80px)}
.sec:nth-of-type(even){background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.sec.hero-sec{background:var(--hero)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(14px,2.4vh,26px)}
.row{display:flex;gap:clamp(16px,3vw,36px);align-items:flex-start;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);flex:1 1 15em}
.card b{display:block;margin-bottom:.3em}
.card span{color:var(--muted);font-size:.92em}
.shot{border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);background:var(--surface);max-height:640px;width:auto;height:auto;max-width:100%}
figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;flex:0 1 auto}
figcaption{color:var(--muted);font-size:.85em;max-width:16em}
.diagram{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.chat{aspect-ratio:880/1273;width:min(100%,330px);overflow:hidden;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.chat img{width:100%;display:block}
.big{font-size:clamp(34px,6.5vw,76px);font-weight:700;line-height:1.1;letter-spacing:-.03em}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
ul.check{list-style:none;padding:0;margin:0;display:grid;gap:10px;flex:1 1 14em}
ul.check li{display:flex;gap:.7em;align-items:flex-start}
ul.check li::before{content:"\2713";color:var(--accent-2);font-weight:700}
.pill{display:inline-block;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.15em .8em;font-size:.85em;color:var(--muted)}
.cmd{direction:ltr;text-align:left;font:500 .85em/1.5 ui-monospace,Consolas,monospace;background:#0f1216;color:#d6e2ff;border-radius:12px;padding:14px 18px;overflow:auto;max-width:100%}
.linkrow{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:14px;flex:1 1 16em}

/* ---- hero */
.hero{background:var(--hero);padding:clamp(48px,10vh,110px) clamp(18px,6vw,80px) clamp(40px,8vh,90px)}
.hero .wrap{flex-direction:row;align-items:center;gap:clamp(24px,5vw,64px);flex-wrap:wrap}
.hero-text{flex:1 1 20em;display:flex;flex-direction:column;gap:18px}
.hero-shot{flex:0 1 300px;display:flex;justify-content:center}
.hero-shot img{width:min(100%,300px)}
.hero .linkrow{margin-top:6px}
footer{padding:28px 18px 60px;text-align:center;color:var(--muted);font-size:.85em}

/* ---- reveal on scroll (only when JavaScript runs and motion is allowed) */
.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.js .reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .reveal{opacity:1;transform:none;transition:none}}

/* ---- presentation mode: the same sections as slides */
.bar{display:none}
.deck-mode{overflow:hidden;height:100vh}
.deck-mode .top,.deck-mode .hero,.deck-mode footer{display:none}
.deck-mode main{position:fixed;inset:0}
.deck-mode .sec{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5vmin 7vw 12vmin;opacity:0;visibility:hidden;transform:translateX(3%);transition:opacity .35s,transform .35s,visibility .35s;overflow:auto;background:var(--bg)}
.deck-mode[dir=rtl] .sec,[dir=rtl].deck-mode .sec{transform:translateX(-3%)}
.deck-mode .sec.hero-sec{background:var(--hero)}
.deck-mode .sec.active{opacity:1;visibility:visible;transform:none}
.deck-mode .reveal{opacity:1!important;transform:none!important}
.deck-mode .wrap{max-width:1200px;width:100%}
.deck-mode .shot{max-height:54vh}
.deck-mode .chat{height:56vh;width:auto}
.deck-mode .bar{display:flex;position:fixed;inset-inline:0;bottom:0;align-items:center;justify-content:space-between;gap:2vmin;padding:1.6vmin 4vw;background:linear-gradient(transparent,var(--bg) 60%);z-index:30}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border);border:0;padding:0;cursor:pointer}
.dot.active{background:var(--accent);transform:scale(1.35)}
.nav2{display:flex;gap:8px;align-items:center}
.nav2 button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:.35em .9em}
.nav2 button:disabled{opacity:.4;cursor:default}
.count{color:var(--muted);font-size:.8em;min-width:3.5em;text-align:center;direction:ltr}
.progress{display:none;position:fixed;top:0;inset-inline-start:0;height:4px;background:var(--accent);transition:width .3s;z-index:40}
.deck-mode .progress{display:block}
@media (max-width:1180px){.brand span{display:none}}
@media (max-width:760px){.links{display:none}.hero .wrap{flex-direction:column;align-items:flex-start}.hero-shot{align-self:center}.chat{width:min(100%,300px)}.tools .btn.present-btn span{display:none}}
@media print{html,body{overflow:visible;height:auto}.top,.bar,.progress{display:none}.reveal{opacity:1!important;transform:none!important}.sec{page-break-inside:avoid}}
</style>
</head>

  var root = document.documentElement;
  var sections = Array.prototype.slice.call(document.querySelectorAll(".sec"));
  var dotsBox = document.getElementById("dots");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  var count = document.getElementById("count");
  var progress = document.getElementById("progress");
  var presentBtn = document.getElementById("present");
  var exitBtn = document.getElementById("exit");
  var lang = "en";
  var index = 0;
  var deck = false;

  try {
    var saved = window.localStorage.getItem("dcn-deck-lang");
    if (saved === "ar" || saved === "en") lang = saved;
  } catch (e) { /* storage may be blocked on file:// */ }
  if (/[?&]lang=ar/.test(location.search)) lang = "ar";
  if (/[?&]lang=en/.test(location.search)) lang = "en";

  sections.forEach(function (section, i) {
    section.querySelectorAll(".wrap > *").forEach(function (node) { node.classList.add("reveal"); });
    var dot = document.createElement("button");
    dot.className = "dot";
    dot.type = "button";
    dot.setAttribute("aria-label", String(i + 1));
    dot.addEventListener("click", function () { go(i); });
    dotsBox.appendChild(dot);
  });

  function applyLang() {
    var dict = T[lang];
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (node) { node.textContent = dict[node.getAttribute("data-t")] || ""; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-img]"), function (node) { node.src = "../assets/" + node.getAttribute("data-img").replace("{lang}", lang); });
    prev.textContent = (lang === "ar" ? "\u203a " : "\u2039 ") + dict.prev;
    next.textContent = dict.next + (lang === "ar" ? " \u2039" : " \u203a");
    presentBtn.textContent = dict.present;
    exitBtn.textContent = dict.exit;
    document.getElementById("lang").textContent = lang === "ar" ? "EN" : "\u0639\u0631\u0628\u064a";
    try { window.localStorage.setItem("dcn-deck-lang", lang); } catch (e) { /* ignore */ }
  }

  // ---- reveal on scroll and the active nav link (landing mode)
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var reveals = document.querySelectorAll(".reveal");
  if (reduce || !("IntersectionObserver" in window)) {
    Array.prototype.forEach.call(reveals, function (n) { n.classList.add("in"); });
  } else {
    var seen = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) { if (entry.isIntersecting) { entry.target.classList.add("in"); seen.unobserve(entry.target); } });
    }, { threshold: 0.12 });
    Array.prototype.forEach.call(reveals, function (n) { seen.observe(n); });
  }
  var navLinks = Array.prototype.slice.call(document.querySelectorAll("#links a"));
  if ("IntersectionObserver" in window) {
    var current = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        navLinks.forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + entry.target.id); });
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    sections.forEach(function (s) { current.observe(s); });
  }

  // ---- presentation mode: the same sections as slides
  function go(i) {
    index = Math.max(0, Math.min(sections.length - 1, i));
    sections.forEach(function (s, n) { s.classList.toggle("active", n === index); if (n === index) s.scrollTop = 0; });
    Array.prototype.forEach.call(dotsBox.children, function (d, n) { d.classList.toggle("active", n === index); });
    prev.disabled = index === 0;
    next.disabled = index === sections.length - 1;
    count.textContent = (index + 1) + " / " + sections.length;
    progress.style.width = ((index + 1) / sections.length * 100) + "%";
  }

  function enterDeck(at) {
    deck = true;
    document.body.classList.add("deck-mode");
    go(typeof at === "number" ? at : visibleIndex());
    try { history.replaceState(null, "", "#slide-" + (index + 1)); } catch (e) { /* file:// may refuse */ }
  }

  function exitDeck() {
    if (!deck) return;
    deck = false;
    document.body.classList.remove("deck-mode");
    var target = sections[index];
    try { history.replaceState(null, "", "#" + target.id); } catch (e) { /* ignore */ }
    target.scrollIntoView();
  }

  function visibleIndex() {
    var best = 0, bestDist = Infinity;
    sections.forEach(function (s, n) { var d = Math.abs(s.getBoundingClientRect().top - 80); if (d < bestDist) { bestDist = d; best = n; } });
    return best;
  }

  prev.addEventListener("click", function () { go(index - 1); });
  next.addEventListener("click", function () { go(index + 1); });
  presentBtn.addEventListener("click", function () { enterDeck(); });
  exitBtn.addEventListener("click", exitDeck);
  document.getElementById("lang").addEventListener("click", function () { lang = lang === "ar" ? "en" : "ar"; applyLang(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { exitDeck(); return; }
    if (!deck) return;
    var rtl = root.dir === "rtl";
    if (e.key === "ArrowRight") go(index + (rtl ? -1 : 1));
    else if (e.key === "ArrowLeft") go(index + (rtl ? 1 : -1));
    else if (e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(index + 1); }
    else if (e.key === "PageUp") go(index - 1);
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(sections.length - 1);
    else if (e.key === "l" || e.key === "L") { lang = lang === "ar" ? "en" : "ar"; applyLang(); }
  });

  var startX = null, startY = null;
  var stage = document.getElementById("main");
  stage.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (!deck || startX === null) return;
    var dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
    startX = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    var rtl = root.dir === "rtl";
    go(index + ((dx < 0) !== rtl ? 1 : -1));
  }, { passive: true });

  applyLang();
  go(0);
  var slideHash = /^#slide-(\d+)$/.exec(location.hash);
  if (slideHash || /[?&]mode=deck/.test(location.search)) {
    enterDeck(slideHash ? parseInt(slideHash[1], 10) - 1 : 0);
  }
})();
