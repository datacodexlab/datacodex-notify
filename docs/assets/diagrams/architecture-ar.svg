<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="كل شيء يبقى على جهازك حتى تغادر الرسالة إلى واتساب." direction="rtl">
<style>
.node{fill:#ffffff;stroke:#c9d0da;stroke-width:1.5}
.node.hot{fill:#eaf0ff;stroke:#2f6bff;stroke-width:2.5}
