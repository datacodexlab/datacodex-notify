<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Everything stays on your PC until the message leaves for WhatsApp." direction="ltr">
<style>
.node{fill:#ffffff;stroke:#c9d0da;stroke-width:1.5}
.node.hot{fill:#eaf0ff;stroke:#2f6bff;stroke-width:2.5}
.node.side{fill:#fff7e6;stroke:#c98a00;stroke-dasharray:5 4}
.t1{font:600 14px "IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;fill:#14171c}
.t2{font:12px "IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;fill:#5b6472}
.arrow{stroke:#2f6bff;stroke-width:2.2}.arrow.dashed{stroke:#c98a00;stroke-dasharray:5 4}
#head path{fill:#2f6bff}
.note{font:13px "IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;fill:#5b6472}
@media (prefers-color-scheme:dark){.node{fill:#171b21;stroke:#3a4250}.node.hot{fill:#1d2a4a;stroke:#5a8bff}.node.side{fill:#2a2412;stroke:#e3a82b}.t1{fill:#e8ebf0}.t2,.note{fill:#9aa3b2}.arrow{stroke:#5a8bff}#head path{fill:#5a8bff}}
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<line class="arrow" x1="150" y1="105" x2="170" y2="105" marker-end="url(#head)"/><line class="arrow" x1="306" y1="105" x2="326" y2="105" marker-end="url(#head)"/><line class="arrow" x1="462" y1="105" x2="482" y2="105" marker-end="url(#head)"/><line class="arrow" x1="618" y1="105" x2="638" y2="105" marker-end="url(#head)"/><line class="arrow" x1="774" y1="105" x2="794" y2="105" marker-end="url(#head)"/><g><rect class="node" x="20" y="70" width="130" height="70" rx="12"/><text class="t1" x="85" y="100" text-anchor="middle">AI agent</text><text class="t2" x="85" y="122" text-anchor="middle">Claude, Codex, more</text></g><g><rect class="node" x="176" y="70" width="130" height="70" rx="12"/><text class="t1" x="241" y="100" text-anchor="middle">CLI</text><text class="t2" x="241" y="122" text-anchor="middle">datacodex-notify-cli</text></g><g><rect class="node hot" x="332" y="70" width="130" height="70" rx="12"/><text class="t1" x="397" y="100" text-anchor="middle">Local app</text><text class="t2" x="397" y="122" text-anchor="middle">127.0.0.1 only</text></g><g><rect class="node" x="488" y="70" width="130" height="70" rx="12"/><text class="t1" x="553" y="100" text-anchor="middle">whatsmeow</text><text class="t2" x="553" y="122" text-anchor="middle">Go client library</text></g><g><rect class="node" x="644" y="70" width="130" height="70" rx="12"/><text class="t1" x="709" y="100" text-anchor="middle">WhatsApp</text><text class="t2" x="709" y="122" text-anchor="middle">linked device</text></g><g><rect class="node" x="800" y="70" width="130" height="70" rx="12"/><text class="t1" x="865" y="100" text-anchor="middle">Your phone</text><text class="t2" x="865" y="122" text-anchor="middle">text + voice</text></g><g><rect class="node side" x="312" y="210" width="170" height="64" rx="12"/><text class="t1" x="397" y="238" text-anchor="middle">Gemini TTS + ffmpeg</text><text class="t2" x="397" y="258" text-anchor="middle">voice notes (optional)</text></g><line class="arrow dashed" x1="397" y1="140" x2="397" y2="204" marker-end="url(#head)"/>
<text class="note" x="480" y="318" text-anchor="middle">Everything stays on your PC until the message leaves for WhatsApp.</text>
</svg>